[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lawsafrica-cli"
version = "0.1.0"
description = "Command-line client for the Laws.Africa Knowledge Base API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lawsafrica = "lawsafrica_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lawsafrica_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
